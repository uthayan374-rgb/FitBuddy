<!DOCTYPE html>
<html>
<head>
    <title>FitBuddy - AI Fitness Plan Generator</title>
</head>

<body>
    <h1>🏋️ FitBuddy</h1>
    <h2>AI Fitness Plan Generator</h2>

    <form action="/generate" method="post">

        <label>Name:</label><br>
        <input type="text" name="name" required><br><br>

        <label>Age:</label><br>
        <input type="number" name="age" required><br><br>

        <label>Fitness Goal:</label><br>
        <select name="goal">
            <option value="weight_loss">Weight Loss</option>
            <option value="muscle_gain">Muscle Gain</option>
            <option value="fitness">General Fitness</option>
        </select><br><br>

        <label>Activity Level:</label><br>
        <select name="activity">
            <option value="beginner">Beginner</option>
            <option value="moderate">Moderate</option>
            <option value="advanced">Advanced</option>
        </select><br><br>

        <label>Available Time (minutes):</label><br>
        <input type="number" name="time" value="30" required><br><br>

        <button type="submit">Generate My Fitness Plan</button>

    </form>
</body>
</html>
